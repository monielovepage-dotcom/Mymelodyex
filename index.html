<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Melody's Little Apology</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--sky:#ffd3e4;--cream:#fff8fb;--ink:#5b3a4c;--mute:#9b7b89;--red:#f2709f;--red2:#e05088;--badge:#ffd6e6;--badgeInk:#c2457a;--yel:#f6e3a6;--yelInk:#7a6420;--lav:#fde8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Thai Looped','Sarabun',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:linear-gradient(180deg,#ffc9de 0%,#ffe6ef 55%,#fff4e6 100%);overflow:hidden}
.card{position:relative;width:100%;max-width:380px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.012) 0 2px,transparent 2px 5px),var(--cream);border-radius:30px;padding:22px 22px 24px;text-align:center;
box-shadow:0 24px 50px rgba(225,100,150,.28),inset 0 0 0 1.5px rgba(255,255,255,.9);animation:in .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.badge{display:inline-block;background:var(--badge);color:var(--badgeInk);font:700 10.5px 'Space Mono',monospace;letter-spacing:.14em;padding:7px 14px;border-radius:999px;transition:.4s}
.badge.wait{background:var(--yel);color:var(--yelInk)}
.frame{position:relative;margin:16px auto 0;width:100%;aspect-ratio:1/.82;border-radius:24px;background:linear-gradient(135deg,#ffd3e4 0%,#fff0f5 55%,#fff2d6 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 6px 14px rgba(220,120,160,.22);display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame i{position:absolute;top:12px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);animation:tw 2s infinite}
.frame i:nth-child(1){left:calc(50% - 16px)}.frame i:nth-child(2){left:calc(50% - 3px);animation-delay:.3s}.frame i:nth-child(3){left:calc(50% + 10px);animation-delay:.6s}
@keyframes tw{50%{opacity:.3;transform:scale(.7)}}
.slot{width:78%;height:86%;display:flex;align-items:center;justify-content:center;animation:fl 3s ease-in-out infinite}
.slot img{height:100%;width:auto;max-width:100%;object-fit:contain}
.slot.empty{border:2px dashed rgba(194,69,122,.35);border-radius:18px;color:rgba(194,69,122,.55);font-size:13px}
@keyframes fl{50%{transform:translateY(-6px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:23px;line-height:1.35;font-weight:700;margin:20px 6px 10px;min-height:93px;display:flex;align-items:center;justify-content:center}
p{margin:0 4px 18px;font-size:12.5px;line-height:1.6;color:var(--mute);min-height:40px}
.btns{display:flex;flex-direction:column;gap:10px;position:relative;min-height:56px}
button{white-space:nowrap;font:600 14px inherit;font-family:inherit;border:0;cursor:pointer;border-radius:16px;padding:15px 18px;transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.95)}
.yes{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;box-shadow:0 8px 16px rgba(224,80,136,.35)}
.no{background:linear-gradient(180deg,#fff,var(--lav));color:#8a5a70;box-shadow:0 6px 12px rgba(200,120,150,.2)}
.ghost{position:absolute;top:70px;background:none;box-shadow:none;color:#a3a5b3;font-size:12px;padding:10px 8px;white-space:nowrap}
.ghost.l{left:0}.ghost.r{right:0}
.row{display:flex;gap:10px}.row .yes{flex:1.4}.row .no{flex:1}.row button{padding:14px 8px}
.row.col{flex-direction:column}.row.col button{flex:none}
.btns>.yes{align-self:flex-start;padding:14px 24px}
.ghost{position:absolute;top:68px;background:none;box-shadow:none;color:#b07a94;font-size:12.5px;padding:10px 6px}
.ghost.l{left:0}.ghost.r{right:0}
.hide{visibility:hidden}
.heart{position:fixed;bottom:-30px;font-size:20px;pointer-events:none;animation:up 3.2s ease-out forwards}
@keyframes up{to{transform:translateY(-70vh) rotate(20deg);opacity:0}}
.toast{position:fixed;right:14px;bottom:14px;width:210px;background:#fff;border-radius:14px;padding:12px;font-size:12px;text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.2);transform:translateY(140%);transition:.5s}
.toast.show{transform:none}
.toast b{display:block;margin-bottom:4px}.toast button{margin-top:8px;padding:7px 12px;font-size:12px;border-radius:10px;background:var(--lav)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <span class="badge" id="badge"></span>
  <div class="frame"><i></i><i></i><i></i><div class="slot empty" id="slot"></div></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="btns" id="btns"></div>
</div>
<div class="toast" id="toast"><b id="tt"></b><span id="tb"></span><br><button onclick="toast.classList.remove('show')">ตกลง</button></div>

};
const $=id=>document.getElementById(id);
const toast=$('toast');
function show(o){
 const b=$('badge');b.textContent=o.badge||CONFIG.badge;b.classList.toggle('wait',!!o.wait);
 if(o.t!==undefined)$('title').textContent=o.t;
 $('sub').textContent=o.s||CONFIG.sub;
 const sl=$('slot');sl.innerHTML='';
 if(o.img){sl.className='slot';sl.innerHTML='<img src="'+o.img+'" alt="">'}else{sl.className='slot empty';sl.textContent='วางตัวละครตรงนี้'}
 [sl,$('title'),$('sub')].forEach(e=>{e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')});
 const bt=$('btns');bt.innerHTML='';bt.style.minHeight=o.ghost?'104px':'';
 if(o.yes){
  const y=mk('yes',o.yes,o.onYes),n=mk('no',o.no,o.onNo);
  if(o.ghost){n.className='ghost '+o.side;n.textContent=o.ghost[0];bt.append(y,n)}
  else{const r=document.createElement('div');r.className='row';r.append(y,n);if(o.stack)r.classList.add('col');bt.append(r)}
 }
}
function mk(c,t,f){const b=document.createElement('button');b.className=c;b.textContent=t;b.onclick=f;return b}
function hearts(n){for(let i=0;i<n;i++)setTimeout(()=>{const h=document.createElement('div');h.className='heart';h.textContent=['🩷','💗','🎀','🩷'][i%3];h.style.left=(10+Math.random()*80)+'%';document.body.append(h);setTimeout(()=>h.remove(),3300)},i*220)}
function happy(){hearts(14);show({badge:CONFIG.badgeThanks,t:CONFIG.happy.t,s:CONFIG.happy.s,img:CONFIG.happy.img});
 setTimeout(()=>{$('tt').textContent=CONFIG.toast[0];$('tb').textContent=CONFIG.toast[1];toast.classList.add('show')},900)}
function scene(i){
 const s=CONFIG.scenes[i];
 show({t:s.t,yes:s.yes,no:s.no,ghost:s.ghost,side:i%2?'r':'l',img:s.img,onYes:happy,onNo:()=>i+1<CONFIG.scenes.length?scene(i+1):waitScene()});
}
function waitScene(){const w=CONFIG.wait;
 show({badge:CONFIG.badgeWait,wait:true,t:w.t,s:w.s,yes:w.yes,no:w.no,stack:true,img:w.img,onYes:happy,onNo:endSeq})}
function endSeq(){const w=CONFIG.wait;let k=0;
 const step=()=>{if(k>=CONFIG.ending.length)return;const e=CONFIG.ending[k++];
  show({badge:CONFIG.badgeWait,wait:true,t:w.t,s:e.s,img:e.img});if(e.hearts)hearts(10);setTimeout(step,3400)};step()}
scene(0);
</script>
</body>
</html>
